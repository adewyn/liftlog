<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Lift Log</title>
</head>
<body>
  <main id="view"></main>

  <div id="timer" hidden>
    <div class="tm-ctl">
      <button class="tm-btn tm-adj" data-a="tm-add" data-d="-15" aria-label="15 seconds less">−15</button>
      <button class="tm-btn tm-adj" data-a="tm-add" data-d="15" aria-label="15 seconds more">+15</button>
      <button class="tm-btn tm-skip" data-a="tm-stop">Skip</button>
    </div>
    <button class="tm-pill" data-a="tm-toggle" aria-label="Rest timer. Tap for more options.">
      <svg class="tm-ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="tm-track" cx="22" cy="22" r="19"/><circle class="tm-prog" id="tm-prog" cx="22" cy="22" r="19" pathLength="100"/></svg>
      <span class="tm-time"><small id="tm-label">Rest</small><span id="tm-left">1:30</span></span>
    </button>
  </div>

  <nav id="tabs">
    <button data-a="tab" data-t="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span>Today</span></button>
    <button data-a="tab" data-t="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button data-a="tab" data-t="body"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10l1.5-2"/></svg><span>Body</span></button>
    <button data-a="tab" data-t="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>Stats</span></button>
    <button data-a="tab" data-t="outlook"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Outlook</span></button>
    <button data-a="tab" data-t="more"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span></button>
  </nav>

  <div id="sheet" hidden>
    <div class="backdrop" data-a="sheet-dismiss"></div>
    <div class="sheet-panel" id="sheet-panel"></div>
  </div>

  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="photo-file" accept="image/*" hidden>
  <input type="file" id="inspo-file" accept="image/*" hidden>

  <script src="app.js"></script>
</body>
</html>
